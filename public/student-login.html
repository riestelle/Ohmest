<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#B5121B"><link rel="icon" href="favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet"><link href="ohmest.css" rel="stylesheet"><title>Student sign in · Ohmest</title></head><body>
<div id="hdr"></div>
<div class="auth"><div class="l"><h1>Welcome to<br>Ohmest</h1><p>Enter your school code, name and student ID to see the exams your professors have opened.</p></div>
<div class="r"><div class="box"><h2>Student sign in</h2><p class="lead">No account needed. Your professor gives you the school code.</p>
<form id="f" novalidate>
<div class="fld"><label for="code">School code</label><input id="code" maxlength="10" autocomplete="off" autocapitalize="characters" placeholder="e.g. K7X2QD" style="text-transform:uppercase;letter-spacing:.1em"><small id="sch"></small></div>
<div class="fld"><label for="name">Full name</label><input id="name" autocomplete="name" placeholder="Juan Dela Cruz"></div>
<div class="fld"><label for="sid">Student ID</label><input id="sid" autocomplete="off" placeholder="Your school ID number"></div>
<div class="alert err hidden" id="err" role="alert"></div>
<button class="btn block" id="go" type="submit" style="margin-top:6px">Continue<span class="ms">arrow_forward</span></button></form>
<p class="alt">Professor? <a href="prof-login.html">Sign in here</a></p></div></div></div>
<div id="ftr"></div><script src="common.js"></script>
<script>
chrome({});
const prev = student() || {};
$('code').value = ls.get('oh_code') || prev.code || ''; $('name').value = prev.name || ''; $('sid').value = prev.sid || '';
const show = m => { const e = $('err'); e.textContent = m; e.classList.toggle('hidden', !m); };
$('f').addEventListener('submit', async ev => {
  ev.preventDefault(); show('');
  const code = $('code').value.trim().toUpperCase(), name = $('name').value.trim(), sid = $('sid').value.trim();
  if (!code || !name || !sid) return show('Enter the school code, your full name and your student ID.');
  $('go').disabled = true;
  try {
    const s = await api('school', { code });
    // attempt tokens are stored per school code + student ID, so a different person on a shared browser never sees the previous one's
    ls.set('oh_stu', JSON.stringify({ code: s.code, school: s.name, name, sid }), sessionStorage); ls.set('oh_code', s.code);
    location.href = 'student.html';
  } catch (e) { show(e.message); $('go').disabled = false; }
});
</script></body></html>
