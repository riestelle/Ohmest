<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#B5121B"><link rel="icon" href="favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet"><link href="ohmest.css" rel="stylesheet"><meta name="robots" content="noindex"><title>Exam editor · Ohmest</title>
<style>
/* ---- ninja top-3 podium (results) ---- */
.pod-wrap{position:relative;overflow:hidden;background:linear-gradient(160deg,#1a1e27,#12151c);border:1px solid #2a2f3a;border-radius:16px;padding:20px 14px 16px;margin-bottom:16px}
.pod-wrap::before{content:"";position:absolute;inset:0;background:radial-gradient(420px 170px at 50% -24%,rgba(199,20,28,.28),transparent 70%);pointer-events:none}
.pod-title{position:relative;text-align:center;color:#fff;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:13px;margin-bottom:18px}
.pod-title span{color:#ff6a5f}
.pod{position:relative;display:flex;justify-content:center;align-items:flex-end;gap:12px}
.pod .seat{display:flex;flex-direction:column;align-items:center;gap:7px;width:31%;max-width:150px}
.pod .ti{font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.pod .ava{position:relative;overflow:hidden;border-radius:50%;background:radial-gradient(circle at 50% 34%,#2b3240,#161a22)}
.pod .band{position:absolute;left:-4px;right:-4px;top:24%;height:15%;background:#B5121B;box-shadow:0 0 6px rgba(181,18,27,.6)}
.pod .eye{position:absolute;top:48%;transform:translateY(-50%);width:14%;aspect-ratio:1;border-radius:50%;background:#ff5a5f;box-shadow:0 0 6px #ff5a5f}
.pod .el{left:27%}.pod .er{right:27%}
.pod .nm{color:#fff;font-weight:700;font-size:13.5px;text-align:center;line-height:1.2;overflow-wrap:anywhere}
.pod .sc{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#aeb6c4}
.pod .base{width:100%;border-radius:9px 9px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;color:#0d0f14;font-weight:900;font-size:20px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.pod .crown{font-size:22px;line-height:1;margin-bottom:-2px}
.pod .king{order:2}.pod .rh{order:3}.pod .lh{order:1}
.pod .king .ava{width:88px;height:88px;box-shadow:0 0 0 3px #f5c543,0 10px 26px rgba(0,0,0,.5)}
.pod .king .ti{color:#f5c543}.pod .king .base{height:86px;background:linear-gradient(#f5c543,#d9a520)}
.pod .rh .ava{width:70px;height:70px;box-shadow:0 0 0 3px #d6dce6,0 8px 20px rgba(0,0,0,.45)}
.pod .rh .ti{color:#d6dce6}.pod .rh .base{height:62px;background:linear-gradient(#d6dce6,#9aa3b2)}
.pod .lh .ava{width:62px;height:62px;box-shadow:0 0 0 3px #d08a52,0 8px 20px rgba(0,0,0,.45)}
.pod .lh .ti{color:#e3a06a}.pod .lh .base{height:46px;background:linear-gradient(#cd7f4b,#a5622f)}
.pod-empty{position:relative;color:#9aa3b2;text-align:center;font-size:13px;padding:6px 0 2px}
@media(max-width:560px){.pod{gap:7px}.pod .seat{width:32%}.pod .king .ava{width:72px;height:72px}.pod .rh .ava,.pod .lh .ava{width:56px;height:56px}.pod .nm{font-size:12px}}
</style>
</head><body>
<div id="hdr"></div>
<main class="wrap ed"><div id="app"><p class="mu">Loading…</p></div></main>
<div id="ftr"></div>
<script src="common.js"></script>
<script src="math.js"></script>
<script src="xlsx-lite.js"></script>
<script>
/* PROFESSOR PAGE. Every action here is checked by the server with a signed login token. */
/* DEF = what a new exam starts with. LEG = what an older exam gets for settings it never had (so nothing changes for it). */
const DEF = { shuffleQ: true, shuffleC: true, copyBlock: false, fsTrack: false, showScore: true, showReview: true, showKey: false, release: 'closed', calc: false, units: false, multi: true, neg: 0, sheet: '', opens: 0, closes: 0, roster: [], followUps: 0, spot: 0, spotMins: 15, sheetUrl: '', sheetKey: '', pin: '', rule: 'count', awayFree: 5, awayBank: 30, awayPen: 0, awayLock: 0, maxLeaves: 0, defTime: 30, defPts: 1, defTol: 2 };
const LEG = { ...DEF, rule: 'count', showScore: false, showReview: false, showKey: false, release: 'finish' };
const EID = new URLSearchParams(location.search).get('id') || '';
let SCH = null, cfg = null, qs = [], SET = { ...DEF }, title = '', atts = [], qstat = [], tab = 'q', open = new Set(), poll = null, IMG = {};
const blank = () => ({ q: '', c: ['', '', '', ''], a: 0, t: SET.defTime || 30, type: 'mc', pts: SET.defPts ?? 1, v: '', tol: SET.defTol ?? 2, u: '', mode: 'fixed', vars: [], f: '', fu: null, img: '', imgAlt: '' });
const fromSrv = (q, k = {}) => ({
  q: q.q, type: q.type || 'mc', c: q.c && q.c.length ? [...q.c] : ['', '', '', ''], a: k.a || 0, t: q.t, pts: q.pts ?? 1,
  v: (k.v || []).join(', '), tol: k.tol ?? 2, u: k.u || '', mode: k.f ? 'rand' : 'fixed', vars: (q.vars || []).map(x => ({ ...x })), f: k.f || '',
  fu: q.fu ? { q: q.fu.q, c: [...q.fu.c], a: k.fa || 0, t: q.fu.t } : null,
  img: q.img || '', imgAlt: q.imgAlt || '',
});
const evn = e => ({ unlocked: 'Professor unlocked the exam', forfeit: 'Question forfeited (away too long)', restored: 'Professor restored the question', tab_hidden: 'Switched tab / app', window_blur: 'Window lost focus', fullscreen_exit: 'Exited fullscreen', back: 'Returned after ' + Math.round((e.d || 0) / 1000) + 's', resumed: 'Reloaded the page', paste: 'Tried to copy/paste', keys: 'Blocked shortcut', flag: 'Flagged the question as unclear', nofs: 'Fullscreen not available on this device' }[e.k] || e.k) + (e.qi != null && e.k !== 'back' ? ' (Q' + (e.qi + 1) + ')' : '');
const fmt = x => String(+Number(x).toPrecision(6));
const fill = (s, vars) => String(s).replace(/\{(\w+)\}/g, (m, k) => (Object.prototype.hasOwnProperty.call(vars, k) ? fmt(vars[k]) : m));
const varTxt = v => Object.entries(v || {}).map(([k, x]) => k + ' = ' + x).join(', ');

const A = (a, d = {}) => api(a, { eid: EID, ...d });
async function profInit() {
  if (!needProf()) return;
  if (!EID) { location.replace('prof.html'); return; }
  try {
    const j = await A('load'); cfg = j.exam;
    SET = { ...LEG, ...(cfg?.set || {}), maxLeaves: cfg?.maxLeaves ?? 0 }; title = cfg?.title || '';
    qs = cfg && cfg.questions.length ? cfg.questions.map((q, i) => fromSrv(q, j.key[i])) : [blank()];
    try { SCH = (await api('me')).school; } catch (e) { /* header only */ }
    chrome({ nav: [['Dashboard', 'prof.html', 'd'], ['Exam editor', '#', 'e']], active: 'e', who: { name: (JSON.parse(ls.get('oh_me') || '{}').user || {}).name || 'Professor', sub: SCH ? SCH.name : '' }, logout: 'index.html' });
    tab = 'q'; dirty = !(cfg && cfg.questions.length);
    const h = location.hash.slice(1); if (h === 'r' || h === 's') return setTab(h);
    renderProf();
  } catch (e) {
    if (!profFail(e)) app.innerHTML = '<div class="alert err">' + esc(e.message) + ' <a href="prof.html">Back to dashboard</a></div>';
  }
}
let dirty = false;
const dirtyTxt = () => dirty ? '<span class="bad">● Unsaved changes</span>' : '<span class="ok">✔ Saved</span>';
const setDirty = v => { dirty = v; const d = $('dirty'); if (d) d.innerHTML = dirtyTxt(); };
const touch = () => { setDirty(true); renderProf(); };
function addQ() { qs.push(blank()); touch(); const el = $('q' + (qs.length - 1)); if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
function renderProf() {
  const st = cfg?.status === 'open', n = cfg?.questions.length || 0;
  const T = (k, ic, t, ct) => `<button class="et ${tab === k ? 'on' : ''}" onclick="setTab('${k}')" type="button"><span class="ms">${ic}</span> ${t}${ct != null ? ' <span class="ct">' + ct + '</span>' : ''}</button>`;
  const body = tab === 'q' ? profQ() : tab === 's' ? profS() : profR();
  app.innerHTML = `<div class="ebar"><div class="row">
 <a class="btn ghost sm" href="prof.html" title="Back to dashboard"><span class="ms">arrow_back</span></a>
 <input id="ttl" class="ttl" value="${esc(title)}" placeholder="Exam title" aria-label="Exam title" ${st ? 'disabled' : ''}>
 <span class="badge ${st ? 'open' : ''}">${st ? 'OPEN' : n ? 'CLOSED' : 'DRAFT'}</span><span class="mu" id="dirty">${dirtyTxt()}</span><span style="flex:1"></span>
 <button id="sv" onclick="saveExam()" ${st ? 'disabled' : ''} type="button"><span class="ms">save</span>Save</button>
 <button class="${st ? 'd' : 'g'}" onclick="setStatus(${st ? 0 : 1})" type="button"><span class="ms">${st ? 'lock' : 'play_arrow'}</span>${st ? 'Close exam' : 'Open to students'}</button></div>
 <div class="etabs">${T('q', 'quiz', 'Questions', qs.length)}${T('s', 'tune', 'Settings')}${T('r', 'insights', 'Results', tab === 'r' ? atts.length : null)}</div><div id="msg" class="mu"></div></div>`
    + (tab === 'r' ? body : `${st && tab === 's' ? visLive() : ''}<fieldset ${st ? 'disabled' : ''} style="border:0;padding:0;margin:0;min-width:0">${st ? '<div class="warn"><b>This exam is open</b>, so questions and settings are locked. Click “Close exam” to edit them.</div>' : ''}${body}</fieldset>`);
}
async function setTab(t) {
  tab = t; clearInterval(poll); window.scrollTo(0, 0);
  if (t === 'r') {
    await loadRes();
    poll = setInterval(async () => { if (document.hidden) return; await loadRes(); const a = document.activeElement; if (tab === 'r' && !(a && (a.id === 'an' || a.tagName === 'INPUT')) && !document.querySelector('details[open]')) renderProf(); }, 30000);
  }
  renderProf();
}
async function loadRes() { try { const j = await A('results'); if (j.exam) cfg = j.exam; atts = j.atts; qstat = j.qs; } catch (e) { /* keep old */ } }

/* results visibility: can be changed while the exam is open */
const visLive = () => `<section class="sec"><h3><span class="ms">visibility</span>Student results (editable while the exam is open)</h3><p class="sub">Saves right away. Students see the change next time they open their exam list.</p>`
  + row('Release results', '“Right after they finish” shows results at once. “When I close the exam” waits.', `<select id="v-rel"><option value="finish" ${SET.release !== 'closed' ? 'selected' : ''}>Right after they finish</option><option value="closed" ${SET.release === 'closed' ? 'selected' : ''}>When I close the exam</option></select>`)
  + row('Show their score', 'Total points out of the maximum.', `<label class="sw"><input type="checkbox" id="v-sc" ${SET.showScore ? 'checked' : ''} aria-label="Show score"><i></i></label>`)
  + row('Let them review their answers', 'Each question with what they answered and whether it was right.', `<label class="sw"><input type="checkbox" id="v-rv" ${SET.showReview ? 'checked' : ''} aria-label="Review answers"><i></i></label>`)
  + row('Also show the correct answers', 'Only applies when reviewing is on.', `<label class="sw"><input type="checkbox" id="v-ky" ${SET.showKey ? 'checked' : ''} aria-label="Show correct answers"><i></i></label>`)
  + `<div class="srow"><button type="button" onclick="saveVis(this)"><span class="ms">save</span>Save results visibility</button></div></section>`;
async function saveVis(b) {
  const x = { release: $('v-rel').value, showScore: $('v-sc').checked, showReview: $('v-rv').checked, showKey: $('v-ky').checked };
  b.disabled = true;
  try { await A('visibility', { settings: x }); Object.assign(SET, x); if (cfg) cfg.set = { ...(cfg.set || {}), ...x }; toast('Saved. Students can see it now.'); renderProf(); }
  catch (e) { alert(e.message); b.disabled = false; }
}
/* ---------------- settings ---------------- */
const dt = ms => ms ? new Date(ms - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16) : '';
document.addEventListener('input', e => { if (e.target.id === 'ttl') title = e.target.value; });
function setSet(e) { const t = e.target, k = t.dataset && t.dataset.s; if (!k) return; SET[k] = t.type === 'checkbox' ? t.checked : t.type === 'datetime-local' ? (t.value ? new Date(t.value).getTime() : 0) : t.type === 'number' ? +t.value : t.value; }
document.addEventListener('input', setSet); document.addEventListener('change', setSet);
const dv = k => typeof DEF[k] === 'boolean' ? (DEF[k] ? 'On' : 'Off') : k === 'release' ? 'When I close the exam' : DEF[k] === 0 ? 'Off' : DEF[k];
const row = (title, desc, ctl, k) => `<div class="srow"><div class="tx"><b>${title}</b><span>${desc}</span>${k ? `<em>Default: ${dv(k)}</em>` : ''}</div><div class="ctl">${ctl}</div></div>`;
const sw = (k, label) => `<label class="sw"><input type="checkbox" data-s="${k}" ${SET[k] ? 'checked' : ''} aria-label="${esc(label || k)}"><i></i></label>`;
const nin = (k, min, max, unit, step) => `<input type="number" min="${min}" ${max != null ? 'max="' + max + '"' : ''} ${step ? 'step="' + step + '"' : ''} data-s="${k}" value="${SET[k]}">${unit ? '<span class="mu">' + unit + '</span>' : ''}`;
const sec = (ic, h, sub, rows) => `<section class="sec"><h3><span class="ms">${ic}</span>${h}</h3>${sub ? '<p class="sub">' + sub + '</p>' : ''}${rows}</section>`;
function resetSet() {
  if (!confirm('Reset every setting to its default? Your class list, exam code, schedule and Google Sheets details are kept.')) return;
  const keep = { roster: SET.roster, opens: SET.opens, closes: SET.closes, sheetUrl: SET.sheetUrl, sheetKey: SET.sheetKey, pin: SET.pin };
  SET = { ...DEF, ...keep }; touch(); toast('Settings reset to defaults. Remember to Save.');
}
function applyDefaults() {
  if (!confirm('Set every question to ' + SET.defTime + ' seconds and ' + SET.defPts + ' point(s)?')) return;
  qs.forEach(q => { q.t = SET.defTime; q.pts = SET.defPts; }); touch(); toast('Applied to ' + qs.length + ' question(s). Remember to Save.');
}
function profS() {
  const clr = k => `<button class="g s" onclick="SET.${k}=0;touch()" type="button">Clear</button>`;
  return `<div class="row" style="justify-content:space-between;margin-bottom:14px";margin-top:14px><p class="mu" style="margin:0;max-width:560px">Every setting shows its default underneath. New exams start with these defaults, so you only change what you need to.</p><button class="g" onclick="resetSet()" type="button"><span class="ms">restart_alt</span>Reset to defaults</button></div>`
    + sec('timer', 'When students can take it', 'Leave both empty to open and close the exam yourself with the button at the top.',
      row('Opens at', 'Students cannot start before this time.', `<input type="datetime-local" data-s="opens" value="${dt(SET.opens)}">${SET.opens ? clr('opens') : ''}`)
      + row('Closes at', 'Students cannot start after this time.', `<input type="datetime-local" data-s="closes" value="${dt(SET.closes)}">${SET.closes ? clr('closes') : ''}`))
    + sec('add_circle', 'Defaults for new questions', 'Used whenever you click “Add question”.',
      row('Time per question', 'How long a student has on each question.', nin('defTime', 5, 3600, 'seconds'), 'defTime')
      + row('Points per question', 'Points for a correct answer.', nin('defPts', 0, 100, 'points', 0.5), 'defPts')
      + row('Numeric tolerance', 'How close a numeric answer must be to count as right.', nin('defTol', 0, 100, '± %', 0.1), 'defTol')
      + row('Apply to existing questions', 'Sets the time and points above on every question already in this exam.', '<button class="g" onclick="applyDefaults()" type="button">Apply to all</button>'))
    + sec('shuffle', 'Question order', null,
      row('Shuffle questions', 'Each student gets the questions in a different order.', sw('shuffleQ'), 'shuffleQ')
      + row('Shuffle answer choices', 'Each student sees the choices in a different order.', sw('shuffleC'), 'shuffleC'))
    + sec('grading', 'Scoring', null,
      row('Negative marking', 'Percent of a question’s points taken off for a wrong answer. 0 means wrong answers cost nothing.', nin('neg', 0, 100, '%'), 'neg')
      + row('Check units on numeric answers', 'When a question has a unit, the student must type it too.', sw('units'), 'units')
      + row('Accept several answers', 'On fixed numeric questions, any of the accepted answers you list counts.', sw('multi'), 'multi'))
    + sec('shield', 'Anti-cheating', null,
      row('When a student leaves the exam', 'Time away: short breaks are free, a long leave cancels that one question (you can restore it). Leave count: the whole exam locks after a number of leaves, and a reload counts as a leave.', `<select data-s="rule"><option value="away" ${SET.rule === 'away' ? 'selected' : ''}>Time away (recommended)</option><option value="count" ${SET.rule !== 'away' ? 'selected' : ''}>Leave count</option></select>`, 'rule')
      + row('Time away: free break', 'Leaving for less than this is ignored. Covers notifications and page reloads.', nin('awayFree', 0, 60, 'seconds'), 'awayFree')
      + row('Time away: free time in total', 'Longer breaks use this up first. Once it is used up, the next long leave cancels the question they left on.', nin('awayBank', 0, 600, 'seconds'), 'awayBank')
      + row('Time away: points taken off', 'Share of that question’s points removed. 100 means the question scores 0. You can restore it in Results.', nin('awayPen', 0, 100, '%'), 'awayPen')
      + row('Time away: lock the exam after', 'Total time away that locks the whole exam as a last resort. 0 means never lock.', nin('awayLock', 0, 240, 'minutes'), 'awayLock')
      + row('Leave count: lock after leaving', 'Only used with the “Leave count” rule. 0 means never lock.', nin('maxLeaves', 0, 99, 'times'), 'maxLeaves')
      + row('Block copy, paste and right-click', 'Also blocks print and save shortcuts.', sw('copyBlock'), 'copyBlock'))
    + sec('visibility', 'After the exam: what students can see', 'Students open this from their exam list or from the “Submitted” screen.',
      row('Release results', 'Showing answers while others are still testing can leak them. “When I close the exam” is safer.', `<select data-s="release"><option value="closed" ${SET.release === 'closed' ? 'selected' : ''}>When I close the exam</option><option value="finish" ${SET.release !== 'closed' ? 'selected' : ''}>Right after they finish</option></select>`, 'release')
      + row('Show their score', 'Total points out of the maximum.', sw('showScore'), 'showScore')
      + row('Let them review their answers', 'Each question with what they answered and whether it was right.', sw('showReview'), 'showReview')
      + row('Also show the correct answers', 'Only applies when reviewing is on.', sw('showKey'), 'showKey'))
    + sec('calculate', 'Student tools', null,
      row('Calculator and formula sheet', 'A built-in calculator plus common physics constants and formulas.', sw('calc'), 'calc')
      + `<div class="srow col"><div class="tx"><b>Extra formulas or notes</b><span>Optional, one per line. Shown on the formula sheet in standard notation, e.g. <code>F = G m_1 m_2 / r^2</code>.</span></div><textarea data-s="sheet" placeholder="v = v_0 + a*t">${esc(SET.sheet)}</textarea></div>`)
    + sec('verified_user', 'Integrity checks (optional)', 'Extra questions that help you spot copied work.',
      row('Follow-up questions', 'After the exam, each student gets up to this many short questions about problems they answered correctly. Max 3.', nin('followUps', 0, 3), 'followUps')
      + row('Handwritten work photos', 'How many of each student’s problems to ask a photo of their written solution for. Max 3.', nin('spot', 0, 3), 'spot')
      + row('Time to upload photos', 'How long students have after finishing.', nin('spotMins', 1, 1440, 'minutes'), 'spotMins'))
    + sec('pin', 'Exam code (optional)', 'Student IDs are not verified, so anyone with the school code could type a classmate’s ID and start first. A code you say out loud in the room (or show on the board) stops that.',
      row('Exam code', 'Students type it before they start. Leave empty for no code. Students who already started are not asked again.', `<input data-s="pin" maxlength="20" autocomplete="off" placeholder="e.g. ROOM7" value="${esc(SET.pin || '')}" style="text-transform:uppercase;letter-spacing:.08em">`, 'pin'))
    + sec('groups', 'Class list', 'Only these student IDs can enter. Leave empty to let anyone from your school in.',
      `<div class="srow col"><textarea data-s="roster" placeholder="One student ID per line" style="min-height:100px">${esc(Array.isArray(SET.roster) ? SET.roster.join('\n') : String(SET.roster || ''))}</textarea></div>`)
    + `<section class="sec"><details ${SET.sheetUrl ? 'open' : ''}><summary><span class="ms">table_view</span>Google Sheets (optional)</summary>
 <div class="srow col"><div class="tx"><span>Each finished attempt is added to your Google Sheet automatically. Setup takes about 3 minutes: see the README. The sheet key is a password you invent; it must match the one inside the Google script.</span></div>
 <label class="lbl">Web app URL <small>ends in /exec</small></label><input data-s="sheetUrl" value="${esc(SET.sheetUrl)}" placeholder="https://script.google.com/macros/s/.../exec">
 <label class="lbl">Sheet key</label><input data-s="sheetKey" value="${esc(SET.sheetKey)}">
 <div class="row"><button class="g" onclick="sheetAct('sheetTest')" type="button">Test connection</button><button class="g" onclick="sheetAct('sheetPush')" type="button">Send all results now</button></div><div id="shmsg" class="mu"></div></div></details></section>`
    + saveBar();
}
async function sheetAct(a) {
  const m = $('shmsg'); m.textContent = 'Working…';
  try { const j = await A(a, { url: SET.sheetUrl, key: SET.sheetKey }); m.innerHTML = '<span class="ok">' + (a === 'sheetTest' ? 'Connected ✔' : 'Sent ' + j.n + ' row(s) ✔') + '</span>'; }
  catch (e) { m.innerHTML = '<span class="bad">' + esc(e.message) + '</span>'; }
}

/* ---------------- questions ---------------- */
const qPrev = t => { const h = MathFmt.rich(t); return h.includes('class="mx') ? '<small>Students will see</small>' + h : ''; };
const fPrev = f => String(f || '').trim() ? '<small>Standard form</small>' + MathFmt.html(f) : '';
const tolRow = (q, i) => `<div class="twocol"><div><label class="lbl">Tolerance <small>± percent</small></label><input type="number" min="0" step="0.1" data-i="${i}" data-f="tol" value="${q.tol}"></div>
 <div><label class="lbl">Unit <small>optional, e.g. N or m/s</small></label><input data-i="${i}" data-f="u" value="${esc(q.u)}" placeholder="N"></div></div>`;
const numRow = (q, i) => `<label class="lbl">Correct answer <small>Separate several accepted answers with commas. Extra ones count only if “Accept several answers” is on in Settings.</small></label><input data-i="${i}" data-f="v" value="${esc(q.v)}" placeholder="9.8, 9.81">${tolRow(q, i)}`;
const randRow = (q, i) => `<p class="hint" style="margin:10px 0 0">Write each changing number in the question as <code>{name}</code>, for example “A {m} kg block…”. Each student gets different values.</p>
 <span class="lbl">Variables</span><div class="vgrid">${q.vars.map((v, j) => `<div class="vc"><div class="vf4"><div><label>Name</label><input data-i="${i}" data-j="${j}" data-f="vn" value="${esc(v.n)}" placeholder="m"></div><div><label>From</label><input type="number" step="any" data-i="${i}" data-j="${j}" data-f="vmin" value="${esc(v.min)}"></div><div><label>To</label><input type="number" step="any" data-i="${i}" data-j="${j}" data-f="vmax" value="${esc(v.max)}"></div><div><label>Step</label><input type="number" step="any" data-i="${i}" data-j="${j}" data-f="vstep" value="${esc(v.step)}"></div></div><button class="icb dg" onclick="qs[${i}].vars.splice(${j},1);touch()" type="button" aria-label="Remove variable"><span class="ms">close</span></button></div>`).join('')}</div>

const readURL = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => no(new Error('Could not read that file.')); r.readAsDataURL(f); });
function shrinkQ(file) {
  const CAP = 650000;   // characters; the server accepts up to 700000
  return new Promise((res, rej) => {
    const im = new Image(), u = URL.createObjectURL(file);
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Could not read that picture. Try a JPEG or PNG.')); };
    im.onload = async () => {
      URL.revokeObjectURL(u);
      const big = Math.max(im.width, im.height);
      if ((file.type === 'image/png' || file.type === 'image/jpeg') && big <= 2000 && file.size * 1.34 <= CAP) { try { return res(await readURL(file)); } catch (e) { return rej(e); } }
      const draw = d => {
        const k = Math.min(1, d / big), c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k));
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
        return c;
      };
      for (const d of [1600, 1400, 1200, 1000]) { const s = draw(d).toDataURL('image/png'); if (s.length <= CAP) return res(s); }
      for (const [d, q] of [[1600, .9], [1400, .82], [1200, .74], [1000, .64]]) { const s = draw(d).toDataURL('image/jpeg', q); if (s.length <= CAP) return res(s); }
      rej(new Error('The picture is too detailed to shrink enough. Crop it or use a simpler one.'));
    };
    im.src = u;
  });
}

  const sid = esc(a.sid);
  const fl = a.flags.length ? a.flags.map(f => `<div class="fl ${f.w >= 2 ? 'bad' : ''}">${f.w >= 2 ? '⚠' : '•'} ${esc(f.txt)}</div>`).join('') : '<div class="mu">No flags.</div>';
  const rw = a.rows.map((r, i) => r.ok === -1 && !r.pen ? '' : `<tr><td>Q${i + 1}</td><td>${esc(varTxt(r.vars))}</td><td>${esc(r.got)}</td><td>${esc(r.exp)}</td><td class="${r.ok ? 'ok' : 'bad'}">${r.ok ? '✔' : r.to ? 'time' : '✘'}${r.pen ? `<br><span class="bad">Forfeited${r.pen.pct < 100 ? ' (−' + r.pen.pct + '%)' : ''}</span><br><button class="g s" data-act="restore" data-sid="${sid}" data-qi="${i}">Restore</button>` : ''}</td><td>${Math.round(r.ms / 100) / 10}s</td></tr>`).join('');
  const rp = a.rep && a.rep.length ? '<div class="mu">Reported unclear: ' + a.rep.map(n => 'Q' + n).join(', ') + '</div>' : '';
  const fu = a.fu.length ? '<div class="mu">Follow-ups: ' + a.fu.map(f => 'Q' + f.n + (f.ok ? ' ✔' : ' ✘')).join(', ') + '</div>' : '';
  let work = '';
  if (a.workReq.length) {
    work = '<b>Handwritten work</b>' + a.workReq.map(n => {
      const r = a.rows[n - 1], img = IMG[a.sid] && IMG[a.sid][n];
      return `<div class="card"><div>Q${n}: ${esc(fill(cfg.questions[n - 1].q, r.vars))}</div><div class="mu">Their answer: <b>${esc(r.got)}</b> · Expected: <b>${esc(r.exp)}</b></div>${a.work.includes(n) ? (img ? `<img class="thumb" src="${esc(img)}" alt="Work for Q${n}">` : `<button class="g s" data-act="work" data-sid="${sid}">Load photo</button>`) : '<div class="bad">No photo uploaded' + (Date.now() > a.workBy + 60000 ? '' : ' yet') + '</div>'}</div>`;
    }).join('');
  }
  const log = a.ev.map(e => new Date(e.t).toLocaleTimeString() + ' · ' + esc(evn(e))).join('<br>') || 'No events';
  return `<div class="row" style="margin-bottom:6px"><b>Flags</b> <span class="risk r-${a.risk}">${a.risk}</span><span class="mu">· seed ${esc(a.seed)} · receipt ${esc(a.receipt)}</span></div>${fl}${rp}${fu}
 <div class="row" style="margin:8px 0"><button class="g s" data-act="rev" data-v="cleared" data-sid="${sid}">Mark cleared</button><button class="g s" data-act="rev" data-v="oral" data-sid="${sid}">Needs oral check</button><button class="g s" data-act="rev" data-v="" data-sid="${sid}">Clear mark</button></div>
 <div class="scroll"><table><tr><th>Q</th><th>Their numbers</th><th>Their answer</th><th>Expected</th><th></th><th>Time</th></tr>${rw}</table></div>${work}<details style="margin-top:8px"><summary class="mu">Activity log</summary><div class="mu" style="white-space:normal">${log}</div></details>`;
}
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return; const act = b.dataset.act, sid = b.dataset.sid;
  try {
    if (act === 'tg') { open.has(sid) ? open.delete(sid) : open.add(sid); if (open.has(sid)) { const a = atts.find(x => x.sid === sid); if (a && a.work.length && !IMG[sid]) { try { IMG[sid] = (await A('work', { sid })).imgs; } catch (x) { /* ignore */ } } } renderProf(); }
    else if (act === 'work') { b.textContent = 'Loading…'; IMG[sid] = (await A('work', { sid })).imgs; renderProf(); }
    else if (act === 'rev') { await A('review', { sid, review: b.dataset.v }); await loadRes(); renderProf(); }
    else if (act === 'unlock') { if (confirm('Let this student continue? Their answers are kept, the departure count restarts, and the current question gets a fresh timer.')) { await A('unlock', { sid }); await loadRes(); renderProf(); toast('Unlocked'); } }
    else if (act === 'restore') { if (confirm('Restore this question? It will count normally again. The restore is written in the activity log.')) { await A('restore', { sid, qi: +b.dataset.qi }); await loadRes(); renderProf(); toast('Restored'); } }
    else if (act === 'reset') { if (confirm('Delete this attempt so the student can retake?')) { await A('reset', { sid }); delete IMG[sid]; await loadRes(); renderProf(); } }
    else if (act === 'clear') { if (confirm('Delete ALL attempts and work photos? This cannot be undone. Export to Excel first.')) { const j = await A('clear'); IMG = {}; open.clear(); await loadRes(); renderProf(); alert('Cleared ' + j.n + ' attempt(s).'); } }
  } catch (x) { alert(x.message); }
});
async function sendAnn(c) { try { await A('announce', { text: c ? '' : $('an').value }); if (c) $('an').value = ''; alert(c ? 'Cleared' : 'Sent to everyone taking the exam'); } catch (e) { alert(e.message); } }
async function pushNow(b) { b.disabled = true; try { const j = await A('sheetPush', { url: SET.sheetUrl, key: SET.sheetKey }); alert('Sent ' + j.n + ' row(s) to Google Sheets.'); } catch (e) { alert(e.message); } b.disabled = false; }

async function exportX() {
  const Q = cfg.questions;
  const mark = r => r.pen ? 'Forfeited' : r.ok === -1 ? '—' : r.ok ? 'Correct' : r.to ? 'Timed out' : 'Wrong';
  const res = [['Student', 'Student ID', 'Status', 'Score', 'Total', 'Percent', 'Integrity risk', 'Flags', 'Professor review', 'Times left exam', 'Seconds away', 'Work photos', 'Receipt', ...Q.map((_, i) => 'Q' + (i + 1))]];
  const ans = [['Student', 'Student ID', 'Q', 'Their numbers', 'Their answer', 'Expected', 'Result', 'Seconds']];
  const flg = [['Student', 'Student ID', 'Risk', 'Check', 'Weight', 'Detail']];
  const log = [['Student', 'Student ID', 'Time', 'Event', 'Question']];
  atts.forEach(a => {
    res.push([a.name, a.sid, a.status, a.score, a.of, a.pct, a.risk, a.flags.filter(f => f.w > 0).map(f => f.txt).join(' | '), a.review, a.leaves, a.away, a.workReq.length ? a.work.length + '/' + a.workReq.length : '', a.receipt, ...a.rows.map(mark)]);
    a.rows.forEach((r, i) => { if (r.ok !== -1) ans.push([a.name, a.sid, i + 1, varTxt(r.vars), r.got, r.exp, mark(r), Math.round(r.ms / 100) / 10]); });
    a.flags.forEach(f => flg.push([a.name, a.sid, a.risk, f.k, f.w, f.txt]));
    a.ev.forEach(e => log.push([a.name, a.sid, new Date(e.t).toLocaleString(), evn(e).replace(/ \(Q\d+\)$/, ''), e.qi != null ? e.qi + 1 : '']));
  });
  const item = [['Q#', 'Question', 'Correct answer', '% correct', 'Avg seconds', 'Time limit', 'Reported unclear by']];
  qstat.forEach(q => item.push([q.n, q.q, q.key, q.pct == null ? '' : Math.round(q.pct * 100) / 100, q.avg == null ? '' : Math.round(q.avg / 100) / 10, q.t, q.rep ? q.rep + ' (' + q.repBy.join(', ') + ')' : '']));
  const nm = (cfg.title || 'exam').replace(/[^\w\- ]/g, '');
  XlsxLite.save([['Results', res], ['Answers', ans], ['Flags', flg], ['Item analysis', item], ['Activity log', log]], nm + ' results.xlsx');   // built in: no CDN, works offline
}
const markDirty = e => { const t = e.target; if (tab === 'r' || !t.closest || !t.closest('#app') || ['an', 'imt'].includes(t.id) || t.type === 'file') return; setDirty(true); };
document.addEventListener('input', markDirty, true); document.addEventListener('change', markDirty, true);
addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
