<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ProctorQuiz</title>
<link rel="stylesheet" href="/style.css">
</head><body>
<div id="hd"><button onclick="document.body.classList.toggle('big')" aria-label="Larger text">A+</button><span id="sch">ProctorQuiz</span></div>
<div id="app"><p class="mu">Loading…</p></div>
<script src="/common.js"></script>
<script>
/* STUDENT PAGE. The professor page is a separate file (prof.html); nothing about it is loaded here. */
const COARSE = matchMedia('(pointer:coarse)').matches;          // phones and tablets
let S = { sid: '', token: '', v: null, sel: null, t0: 0, fs: false, nofs: false, timer: null, info: null, num: { v: '', u: '' }, ann: null, poll: null };
let busy = false, away = false, lt = null;

const fsFn = () => { const e = document.documentElement; return e.requestFullscreen || e.webkitRequestFullscreen; };
const inFs = () => document.fullscreenElement || document.webkitFullscreenElement;
async function tryFs() { const f = fsFn(); if (!f) return false; try { await f.call(document.documentElement); return true; } catch (e) { return false; } }

async function studentInit() {
  let saved = null;
  try { saved = JSON.parse(sessionStorage.getItem('att') || 'null'); } catch (e) { /* ignore */ }
  try { S.info = await api('info'); } catch (e) { app.innerHTML = '<div class="card"><b>Cannot load the exam.</b><br>' + esc(e.message) + '<p class="mu">If you are the professor, see the Vercel setup steps in the README.</p></div>'; return; }
  setHeader(S.info.school);
  if (saved) {
    S.sid = saved.sid; S.token = saved.token;
    try { const j = await api('start', { name: saved.name, sid: saved.sid, token: saved.token }); return setView(j.view); } catch (e) { /* fall through to the form */ }
  }
  gate();
}
function gate(msg = '') {
  const i = S.info;
  if (!i.open) {
    app.innerHTML = '<h1>' + esc(i.title || 'ProctorQuiz') + '</h1><div class="card">No exam is open right now.' + (i.opens && Date.now() < i.opens ? ' It opens ' + esc(new Date(i.opens).toLocaleString()) + '.' : ' Wait for your professor’s go-ahead, then refresh.') + '</div>';
    return;
  }
  const rules = [
    'Each question has its own timer. When it ends, your answer locks automatically.',
    'You cannot go back to earlier questions.',
    'Stay on this screen. Switching tabs or apps' + (i.s.fsTrack ? ', or leaving fullscreen (where your device supports it),' : '') + ' is recorded and shown to your professor.',
    i.maxLeaves > 0 ? 'Leaving ' + i.maxLeaves + ' time' + (i.maxLeaves === 1 ? '' : 's') + ' locks the exam.' : '',
    i.s.copyBlock ? 'Copying and pasting are disabled.' : '',
    'Reloading the page counts as leaving.',
    i.fu ? 'After the main questions you may get ' + i.fu + ' short follow-up question' + (i.fu === 1 ? '' : 's') + ' about your own problems.' : '',
    i.spot ? 'When you finish, you will be asked to upload a photo of your handwritten solution for ' + i.spot + ' of your problems within ' + i.spotMins + ' minutes. Keep your scratch paper and a camera ready.' : '',
  ].filter(Boolean);
  app.innerHTML = `<h1>${esc(i.title)}</h1><div class="mu">${i.n} questions · about ${Math.ceil(i.sec / 60)} min</div>
 <div class="card"><label class="mu">Full name</label><input id="nm" autocomplete="off"><label class="mu">Student ID</label><input id="sd" autocomplete="off"></div>
 <div class="card"><b>Rules</b><ul>${rules.map(r => '<li>' + esc(r) + '</li>').join('')}</ul></div>
 <button id="go" onclick="begin()">Start exam</button><p id="msg" class="bad">${esc(msg)}</p>`;
}
async function begin() {
  const name = $('nm').value.trim(), sid = $('sd').value.trim();
  if (!name || !sid) { $('msg').textContent = 'Enter your name and student ID.'; return; }
  $('go').disabled = true;
  const fsP = S.info.s.fsTrack ? tryFs() : Promise.resolve(false);      // must be requested inside the click
  try {
    const j = await api('start', { name, sid });
    S.sid = sid; S.token = j.token;
    try { sessionStorage.setItem('att', JSON.stringify({ sid, name, token: j.token })); } catch (e) { /* ignore */ }
    const ok = await fsP;
    S.fs = !!ok; S.nofs = S.info.s.fsTrack && !ok;
    setView(j.view);
    if (S.nofs) ev('nofs');
  } catch (e) {
    await fsP;
    if (inFs() && document.exitFullscreen) document.exitFullscreen().catch(() => {});
    gate(e.message);
  }
}
function setView(v) {
  if (S.v && (v.cur !== S.v.cur || v.f !== S.v.f)) { S.sel = null; S.num = { v: '', u: '' }; }
  S.v = v; S.ann = v.ann || null; S.t0 = performance.now();
  if (v.status !== 'in_progress') {
    clearInterval(S.timer); clearInterval(S.poll); S.timer = S.poll = null;
    if (inFs() && document.exitFullscreen) document.exitFullscreen().catch(() => {});
    const lk = v.status === 'locked';
    app.innerHTML = `<h1>${lk ? 'Exam locked' : 'Submitted ✔'}</h1><div class="card">${lk ? 'You left the exam too many times, so it was locked. Your answers so far were saved. Please see your professor.' : 'Your answers were recorded. Your professor will share results.'}</div>`
      + (v.work ? workUI(v.work) : '')
      + (v.score !== undefined ? '<div class="card"><b>Your score: ' + v.score + ' / ' + v.of + '</b></div>' : '')
      + (v.receipt ? '<div class="card mu">Submission receipt: <b>' + esc(v.receipt) + '</b> (screenshot it as proof you finished)</div>' : '');
    return;
  }
  if (!S.timer) S.timer = setInterval(tick, 250);
  if (!S.poll) S.poll = setInterval(spoll, 15000);
  showQ();
}
function showQ() {
  const v = S.v, canFs = !!fsFn() && S.info.s.fsTrack;
  const fsWarn = canFs && !inFs() ? '<div class="warn">' + (S.fs ? 'You left fullscreen. This was recorded. ' : 'Please return to fullscreen. ') + '<button onclick="enterFs()">Return to fullscreen</button></div>' : '';
  app.innerHTML = `<div class="nosel"><div class="row mu" style="justify-content:space-between"><span>${v.f ? 'Follow-up' : 'Question'} ${v.cur + 1} of ${v.total}</span><b id="tl"></b></div><div class="bar"><i id="tb"></i></div>
 ${fsWarn}
 ${v.max > 0 && v.leaves > 0 ? '<div class="warn">You have left the exam ' + v.leaves + ' time' + (v.leaves === 1 ? '' : 's') + '. The exam locks at ' + v.max + '.</div>' : ''}
 <div id="ann">${S.ann ? '<div class="warn">📢 ' + esc(S.ann.text) + '</div>' : ''}</div>${S.info.s.calc ? '<button class="g" onclick="tools()">🧮 Calculator &amp; formulas</button> ' : ''}<button class="g" onclick="flagQ(this)">⚑ Unclear question?</button>
 ${v.f ? '<div class="card mu" style="margin-top:14px">Your problem was:<br><span style="color:var(--tx)">' + esc(v.ctx) + '</span></div>' : ''}
 <h2 style="font-size:19px;margin-top:16px">${esc(v.q)}</h2>
 ${v.type === 'num' ? numIn() : ''}${v.choices.map((c, i) => `<button class="opt ${S.sel === c.i ? 'on' : ''}" onclick="S.sel=${c.i};showQ()"><b>${L(i)}.</b> ${esc(c.t)}</button>`).join('')}
 <button onclick="lock()">Lock in answer</button></div>`;
  tick();
}
async function enterFs() { const ok = await tryFs(); if (ok) S.fs = true; showQ(); }

/* calculator + formula sheet (in-page overlay, never counts as leaving) */
const CONST = [['g', '9.8 m/s²'], ['G', '6.674×10⁻¹¹ N·m²/kg²'], ['c', '3.00×10⁸ m/s'], ['k (Coulomb)', '8.99×10⁹ N·m²/C²'], ['ε₀', '8.85×10⁻¹² F/m'], ['h', '6.626×10⁻³⁴ J·s'], ['e', '1.602×10⁻¹⁹ C'], ['mₑ', '9.11×10⁻³¹ kg'], ['mₚ', '1.673×10⁻²⁷ kg'], ['k_B', '1.381×10⁻²³ J/K'], ['N_A', '6.022×10²³ /mol'], ['R', '8.314 J/(mol·K)']];
const FORM = ['v = v₀ + at', 'x = x₀ + v₀t + ½at²', 'v² = v₀² + 2aΔx', 'F = ma', 'W = Fd cosθ', 'KE = ½mv²', 'PE = mgh', 'p = mv', 'τ = rF sinθ', 'F = Gm₁m₂/r²', 'F = kq₁q₂/r²', 'V = IR', 'P = IV'];
function tools() {
  if ($('tools')) return;
  const d = document.createElement('div'); d.id = 'tools'; d.style.cssText = 'position:fixed;inset:0;background:var(--bg);z-index:50;overflow:auto;padding:16px';
  d.innerHTML = `<div style="max-width:760px;margin:0 auto"><div class="row" style="justify-content:space-between"><b>Calculator &amp; formulas</b><button onclick="$('tools').remove()">Close</button></div>
 <div class="card"><input id="cx" placeholder="Type or tap, e.g. 9.8*sin(30)" autocomplete="off" onkeydown="if(event.key==='Enter')cc()"><div id="cr" style="font-size:20px;min-height:30px"></div>
 <div class="row">${['7', '8', '9', '/', 'sin(', 'cos(', '4', '5', '6', '*', 'tan(', '√(', '1', '2', '3', '-', 'log(', 'ln(', '0', '.', '^', '+', 'π', 'e', '(', ')', 'E'].map(k => `<button class="g" onclick="ci('${k}')">${k}</button>`).join('')}<button onclick="cc()">=</button><button class="g" onclick="$('cx').value='';$('cr').textContent=''">C</button></div><div class="mu">Angles are in degrees. Use E for ×10ⁿ, e.g. 3E8.</div></div>
 <div class="card"><b>Constants</b>${CONST.map(c => `<div class="mu">${c[0]} = ${c[1]}</div>`).join('')}<b style="display:block;margin-top:8px">Formulas</b>${FORM.map(f => `<div class="mu">${f}</div>`).join('')}${S.info.s.sheet ? '<b style="display:block;margin-top:8px">From your professor</b><div class="mu" style="white-space:pre-wrap">' + esc(S.info.s.sheet) + '</div>' : ''}</div></div>`;
  document.body.appendChild(d);
}
const ci = k => { $('cx').value += k === 'e' ? '2.718281828' : k; };
function cc() {
  try {
    let s = $('cx').value.replace(/π/g, 'Math.PI').replace(/√\(/g, 'Math.sqrt(').replace(/\^/g, '**').replace(/\bln\(/g, 'Math.log(').replace(/\blog\(/g, 'Math.log10(').replace(/(\d)E(-?\d)/g, '$1e$2').replace(/\b(a?(?:sin|cos|tan))\(/g, '$1d(');
    const t = s.replace(/Math\.(PI|sqrt|log10|log)|a?(sin|cos|tan)d/g, ''); if (/[^0-9+\-*/().e\s]/.test(t)) throw 0;
    const Dg = Math.PI / 180, f = Function('sind', 'cosd', 'tand', 'asind', 'acosd', 'atand', 'return(' + s + ')')(x => Math.sin(x * Dg), x => Math.cos(x * Dg), x => Math.tan(x * Dg), x => Math.asin(x) / Dg, x => Math.acos(x) / Dg, x => Math.atan(x) / Dg);
    $('cr').textContent = isFinite(f) ? '= ' + (+f.toPrecision(10)) : 'Error';
  } catch (e) { $('cr').textContent = 'Error'; }
}
const numIn = () => `<input id="nv" inputmode="decimal" autocomplete="off" placeholder="Your answer (number)" value="${esc(S.num.v)}" oninput="S.num.v=this.value">${S.info.s.units ? `<input autocomplete="off" placeholder="Unit (e.g. N)" value="${esc(S.num.u)}" oninput="S.num.u=this.value">` : ''}`;
function flagQ(b) { ev('flag'); b.textContent = '⚑ Reported'; }
async function spoll() {
  if (!S.v || S.v.status !== 'in_progress' || busy) return;
  try {
    const j = await api('state', { sid: S.sid, token: S.token });
    if (j.view.status !== 'in_progress' || j.view.cur !== S.v.cur || j.view.f !== S.v.f) setView(j.view);
    else { S.ann = j.view.ann || null; const a = $('ann'); if (a) a.innerHTML = S.ann ? '<div class="warn">📢 ' + esc(S.ann.text) + '</div>' : ''; }
  } catch (e) { /* offline blip, try again later */ }
}
function tick() {
  const v = S.v; if (!v || v.status !== 'in_progress') return;
  const left = v.left - (performance.now() - S.t0), tl = $('tl'), tb = $('tb');
  if (left <= 0) { lock(); return; }
  if (tl) { tl.textContent = Math.ceil(left / 1000) + 's'; tl.className = left < 6000 ? 'bad' : ''; tb.style.width = left / (v.t * 10) + '%'; }
}
async function lock() {
  if (busy) return; busy = true;
  try { const j = await api('answer', { sid: S.sid, token: S.token, qi: S.v.qi, f: S.v.f ? 1 : 0, sel: S.sel, v: S.num.v, u: S.num.u }); setView(j.view); } catch (e) { /* retried by the timer */ }
  busy = false;
}

/* ---- handwritten work photo ---- */
function workUI(w) {
  return `<div class="card"><b>Show your work</b><p class="mu">Your professor asked for a clear photo of your handwritten solution for ${w.items.length > 1 ? 'these problems' : 'this problem'}. ${w.open ? 'Upload by <b>' + esc(new Date(w.by).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })) + '</b>.' : '<span class="bad">The upload window has closed.</span>'}</p>`
    + w.items.map(x => `<div class="card"><div class="mu">Your problem ${x.n}</div><div>${esc(x.q)}</div>${x.up ? '<p class="ok">✔ Uploaded</p>' : ''}${w.open ? `<input type="file" accept="image/*" data-qi="${x.qi}" onchange="upl(this)"><div class="mu" id="up${x.qi}"></div>` : ''}</div>`).join('') + '</div>';
}
async function upl(inp) {
  const qi = +inp.dataset.qi, f = inp.files[0], m = $('up' + qi); if (!f) return;
  m.textContent = 'Uploading…';
  try { const img = await shrink(f); const j = await api('upload', { sid: S.sid, token: S.token, qi, img }); setView(j.view); }
  catch (e) { m.textContent = e.message || 'Upload failed. Try again.'; }
}
function shrink(file) {
  return new Promise((res, rej) => {
    const im = new Image(), u = URL.createObjectURL(file);
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Could not read that photo. Try a JPEG or PNG.')); };
    im.onload = () => {
      URL.revokeObjectURL(u);
      for (const [d, q] of [[1400, .72], [1100, .6], [900, .5], [700, .4]]) {
        const k = Math.min(1, d / Math.max(im.width, im.height)), c = document.createElement('canvas');
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
        const s = c.toDataURL('image/jpeg', q); if (s.length <= 560000) return res(s);
      }
      rej(new Error('The photo is too large. Move closer to the paper, then try again.'));
    };
    im.src = u;
  });
}

/* ---- proctoring events ---- */
async function ev(k) {
  if (!S.v || S.v.status !== 'in_progress') return;
  try { const j = await api('event', { sid: S.sid, token: S.token, k }); if (j.view.status !== 'in_progress' || k === 'back') setView(j.view); } catch (e) { /* ignore */ }
}
/* a window losing focus for under 2 seconds (keyboard, notification) is ignored; phones only report real app switches */
function leave(k) {
  if (!S.v || S.v.status !== 'in_progress') return;
  if (k === 'window_blur' && COARSE) return;
  if (away) { if (lt && k !== 'window_blur') { clearTimeout(lt); lt = null; ev(k); } return; }
  away = true;
  if (k === 'window_blur') lt = setTimeout(() => { lt = null; if (away) ev(k); }, 2000); else ev(k);
}
function back() {
  if (!away) return; away = false;
  if (lt) { clearTimeout(lt); lt = null; return; }   // short blip, never reported
  ev('back');
}
document.addEventListener('visibilitychange', () => document.hidden ? leave('tab_hidden') : back());
addEventListener('blur', () => leave('window_blur')); addEventListener('focus', back);
function fsChange() { if (S.fs && S.v && S.v.status === 'in_progress') { if (!inFs()) leave('fullscreen_exit'); else back(); showQ(); } }
document.addEventListener('fullscreenchange', fsChange); document.addEventListener('webkitfullscreenchange', fsChange);
['copy', 'cut', 'paste', 'contextmenu', 'dragstart'].forEach(t => document.addEventListener(t, e => {
  if (!S.v || S.v.status !== 'in_progress' || !(S.info && S.info.s && S.info.s.copyBlock)) return;
  e.preventDefault(); if (t !== 'contextmenu') ev('paste');
}));
document.addEventListener('keydown', e => {
  if (!S.v || S.v.status !== 'in_progress' || !(S.info && S.info.s && S.info.s.copyBlock)) return;
  if (e.key === 'PrintScreen' || ((e.ctrlKey || e.metaKey) && 'cpsuaxCPSUAX'.includes(e.key))) { e.preventDefault(); ev('keys'); }
});
studentInit();
</script></body></html>
