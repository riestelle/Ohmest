<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>ProctorQuiz - Live Exam</title>
<link href="stitch.css" rel="stylesheet">
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
  .nosel{user-select:none;-webkit-user-select:none}
  .nosel input{user-select:text;-webkit-user-select:text}
  .pq-in{width:100%;border:1px solid #E6D9D7;border-radius:8px;padding:12px;font:inherit;background:#fff;color:#1F1717;margin-top:8px}
  .pq-in:focus{outline:2px solid #B5121B33;border-color:#B5121B}
</style>
</head>
<body class="min-h-screen flex flex-col bg-[#FBF7F6] text-[#1F1717]">
<div class="w-full flex-1 flex flex-col justify-between">
<div class="w-full flex-shrink-0">
<header class="w-full bg-white border-b border-[#E6D9D7] px-8 h-14 flex items-center justify-between">
<div class="flex items-center gap-2"><div class="w-7 h-7 rounded bg-[#B5121B] text-white flex items-center justify-center font-bold text-sm tracking-tight">P</div><span class="font-bold text-base tracking-tight text-[#1F1717]">ProctorQuiz</span></div>
<div class="text-center font-semibold text-sm text-[#1F1717] tracking-tight" id="exam-title"></div>
<div class="flex items-center gap-3"><span style="display:none" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-neutral-100 text-[#1F1717] border border-[#E6D9D7]" id="progress-badge"></span><button class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium border border-[#E6D9D7] bg-white" onclick="document.documentElement.style.fontSize = document.documentElement.style.fontSize ? '' : '20px'" type="button" aria-label="Larger text">A+</button></div>
</header>
<div class="w-full px-8 pt-4 pb-0" id="banners"></div>
<div class="w-full px-8 pt-4 pb-2 hidden" id="timer-section">
<div class="max-w-[900px] mx-auto flex items-center justify-between mb-2">
<span class="text-xs font-semibold text-[#6F6262] uppercase tracking-wider">Per-question timer</span>
<div class="font-mono text-2xl font-bold text-[#1F1717] tracking-tight" id="countdown-display"></div>
</div>
<div class="max-w-[900px] mx-auto w-full h-2.5 bg-[#E6D9D7]/50 rounded-full overflow-hidden"><div class="h-full bg-[#B5121B] rounded-full" id="timer-bar" style="width:100%"></div></div>
</div>
</div>
<main class="w-full max-w-[1440px] mx-auto px-8 py-6 flex-1 flex flex-col justify-center items-center" id="app"><p class="text-sm text-[#6F6262]">Loading…</p></main>
</div>
<script src="common.js"></script>
<script>
/* LIVE EXAM PAGE. The server owns the clock, the order and the answer key; this page only draws and reports. */
const COARSE = matchMedia('(pointer:coarse)').matches;
let S = { sid: '', name: '', token: '', v: null, sel: null, t0: 0, fs: false, nofs: false, timer: null, poll: null, info: null, num: { v: '', u: '' }, ann: null };
let busy = false, away = false, lt = null, retryAt = 0;
const BTN_ON = 'bg-[#B5121B] hover:bg-[#8F0E15] text-white cursor-pointer', BTN_OFF = 'bg-neutral-300 text-neutral-500 cursor-not-allowed';
const CARD = 'max-w-[900px] w-full mx-auto bg-white border border-[#E6D9D7] rounded-xl p-8';
const fsFn = () => { const e = document.documentElement; return e.requestFullscreen || e.webkitRequestFullscreen; };
const inFs = () => document.fullscreenElement || document.webkitFullscreenElement;
async function tryFs() { const f = fsFn(); if (!f) return false; try { await f.call(document.documentElement); return true; } catch (e) { return false; } }
const exitFs = () => { if (inFs()) { const f = document.exitFullscreen || document.webkitExitFullscreen; if (f) { try { const p = f.call(document); if (p && p.catch) p.catch(() => {}); } catch (e) { /* ignore */ } } } };

function backLink() { return '<a class="inline-block mt-4 px-5 py-2.5 rounded-lg bg-[#B5121B] hover:bg-[#8F0E15] text-white font-semibold text-sm" href="studentDashboard.html">Back to dashboard</a>'; }

async function init() {
  let w = null; try { w = JSON.parse(sessionStorage.getItem('who') || 'null'); } catch (e) { /* ignore */ }
  if (!w) { location.replace('student_login_reg.html'); return; }
  S.name = w.name; S.sid = w.sid;
  try { S.info = await api('info'); }
  catch (e) { app.innerHTML = `<div class="${CARD}"><b>Cannot load the exam.</b><p class="text-sm text-[#6F6262] mt-2">${esc(e.message)}</p>${backLink()}</div>`; return; }
  $('exam-title').textContent = S.info.title || '';
  document.title = (S.info.title ? S.info.title + ' · ' : '') + 'ProctorQuiz';
  intro();
}
function savedAtt() { try { const a = JSON.parse(sessionStorage.getItem('att') || 'null'); return a && String(a.sid).toLowerCase() === String(S.sid).toLowerCase() ? a : null; } catch (e) { return null; } }

function intro(msg = '') {
  const i = S.info, resume = !!savedAtt();
  if (!i.title || (!i.open && !resume)) {
    app.innerHTML = `<div class="${CARD} text-center"><h1 class="text-xl font-bold mb-2">${esc(i.title || 'No exam')}</h1><p class="text-sm text-[#6F6262]">${i.opens && Date.now() < i.opens ? 'This exam opens ' + esc(new Date(i.opens).toLocaleString()) + '.' : 'This exam is not open right now.'}</p>${backLink()}</div>`;
    return;
  }
  const rules = [
    'Each question has its own timer. When it ends, your answer locks automatically.',
    'You cannot go back to earlier questions.',
    'Stay on this screen. Switching tabs or apps' + (i.s.fsTrack ? ', or leaving fullscreen (where your device supports it),' : '') + ' is recorded and shown to your professor.',
    i.maxLeaves > 0 ? 'Leaving ' + i.maxLeaves + ' time' + (i.maxLeaves === 1 ? '' : 's') + ' locks the exam.' : '',
    i.s.copyBlock ? 'Copying and pasting are disabled.' : '',
    'Reloading the page counts as leaving.',
    i.fu ? 'After the main questions you may get ' + i.fu + ' short follow-up question' + (i.fu === 1 ? '' : 's') + ' about your own problems.' : '',
    i.spot ? 'When you finish, you will be asked to upload a photo of your handwritten solution for ' + i.spot + ' of your problems within ' + i.spotMins + ' minutes. Keep your scratch paper and a camera ready.' : '',
  ].filter(Boolean);
  app.innerHTML = `<div class="${CARD}"><h1 class="text-2xl font-bold tracking-tight">${esc(i.title)}</h1>
<p class="text-sm text-[#6F6262] mt-1">${i.n} questions · about ${Math.ceil(i.sec / 60)} min · ${esc(S.name)} (${esc(S.sid)})</p>
<ul class="list-disc pl-5 mt-5 space-y-2 text-sm">${rules.map(r => '<li>' + esc(r) + '</li>').join('')}</ul>
<p class="text-sm text-[#B45309] mt-4" id="imsg">${esc(msg)}</p>
<div class="mt-6 flex gap-3"><button class="px-6 py-3 rounded-lg ${BTN_ON} font-semibold text-sm" id="go" onclick="begin()" type="button">${resume ? 'Resume exam' : 'Start exam'}</button><a class="px-6 py-3 rounded-lg border border-[#E6D9D7] text-sm font-semibold" href="studentDashboard.html">Back</a></div></div>`;
}
async function begin() {
  const go = $('go'); go.disabled = true;
  const fsP = S.info.s.fsTrack ? tryFs() : Promise.resolve(false);     // must be requested inside the click
  const prev = savedAtt();
  try {
    const j = await api('start', { name: S.name, sid: S.sid, token: prev ? prev.token : undefined });
    S.token = j.token;
    try { sessionStorage.setItem('att', JSON.stringify({ sid: S.sid, name: S.name, token: j.token })); } catch (e) { /* ignore */ }
    const ok = await fsP;
    S.fs = !!ok; S.nofs = S.info.s.fsTrack && !ok;
    setView(j.view);
    if (S.nofs) ev('nofs');
  } catch (e) {
    await fsP; exitFs();
    intro(e.message);
  }
}

function banners() {
  const v = S.v, out = [], canFs = !!fsFn() && S.info.s.fsTrack;
  const B = (t, extra = '') => `<div class="max-w-[900px] mx-auto bg-[#FEF3C7] border border-[#FDE68A] text-[#92400E] px-4 py-3 rounded-lg mb-2 flex items-center justify-between gap-3 text-sm font-medium"><span>${t}</span>${extra}</div>`;
  if (v && v.status === 'in_progress') {
    if (canFs && !inFs()) out.push(B((S.fs ? 'You left fullscreen. This was recorded. ' : 'Please return to fullscreen. '), '<button class="px-3 py-1.5 rounded-md bg-[#B5121B] text-white text-xs font-semibold" onclick="enterFs()" type="button">Return to fullscreen</button>'));
    if (v.max > 0 && v.leaves > 0) out.push(B('You have left the exam ' + v.leaves + ' time' + (v.leaves === 1 ? '' : 's') + '. The exam locks at ' + v.max + '.'));
    if (S.ann) out.push(B('📢 ' + esc(S.ann.text)));
  }
  $('banners').innerHTML = out.join('');
}
async function enterFs() { const ok = await tryFs(); if (ok) S.fs = true; banners(); }

function setView(v) {
  if (S.v && (v.cur !== S.v.cur || v.f !== S.v.f)) { S.sel = null; S.num = { v: '', u: '' }; }
  S.v = v; S.ann = v.ann || null; S.t0 = performance.now();
  if (v.status !== 'in_progress') {
    clearInterval(S.timer); clearInterval(S.poll); S.timer = S.poll = null;
    exitFs(); $('timer-section').classList.add('hidden'); $('progress-badge').style.display = 'none'; banners();
    const lk = v.status === 'locked';
    app.innerHTML = `<div class="max-w-[560px] w-full mx-auto bg-white border border-[#E6D9D7] rounded-xl p-8 text-center">
<div class="w-16 h-16 rounded-full ${lk ? 'bg-[#B45309]/10 text-[#B45309]' : 'bg-[#1A7F4B]/10 text-[#1A7F4B]'} mx-auto flex items-center justify-center mb-5 text-3xl">${lk ? '!' : '✓'}</div>
<h1 class="text-2xl font-bold tracking-tight mb-2">${lk ? 'Exam locked' : 'Exam submitted'}</h1>
<p class="text-sm text-[#6F6262] mb-6">${lk ? 'You left the exam too many times, so it was locked. Your answers so far were saved. Please see your professor.' : 'Your answers were recorded. Your professor will share results.'}</p>
<div class="bg-[#FBF7F6] border border-[#E6D9D7] rounded-lg p-5 mb-6 text-left space-y-3">
${v.score !== undefined ? `<div class="flex items-center justify-between"><span class="text-xs font-medium text-[#6F6262]">Score</span><span class="text-lg font-bold text-[#1A7F4B] font-mono">${esc(v.score)} / ${esc(v.of)}</span></div><div class="h-px bg-[#E6D9D7]/70"></div>` : ''}
<div class="flex items-center justify-between gap-3"><span class="text-xs font-medium text-[#6F6262]">Submission receipt</span><span class="text-xs font-mono font-semibold bg-white px-2 py-0.5 rounded border border-[#E6D9D7]">${esc(v.receipt || '')}</span></div>
<p class="text-xs text-[#6F6262]">Screenshot the receipt as proof you finished.</p></div>
${v.work ? workUI(v.work) : ''}
<a class="block w-full py-3 rounded-lg ${BTN_ON} font-semibold text-sm" href="studentDashboard.html">Back to dashboard</a></div>`;
    return;
  }
  if (!S.timer) S.timer = setInterval(tick, 250);
  if (!S.poll) S.poll = setInterval(spoll, 15000);
  showQ();
}

function showQ() {
  const v = S.v, num = v.type === 'num';
  $('timer-section').classList.remove('hidden');
  const pb = $('progress-badge'); pb.style.display = ''; pb.textContent = (v.f ? 'Follow-up ' : 'Question ') + (v.cur + 1) + ' of ' + v.total;
  banners();
  const tiles = v.choices.map((c, i) => `<button class="answer-tile group text-left p-5 rounded-lg border border-[#E6D9D7] bg-white hover:border-[#B5121B]/40 hover:bg-[#FBF7F6] transition-all flex items-center gap-4 ${S.sel === c.i ? 'selected' : ''}" data-i="${c.i}" onclick="pick(${c.i})" type="button"><span class="tile-indicator flex-shrink-0 w-8 h-8 rounded-full border border-[#E6D9D7] font-semibold text-sm flex items-center justify-center text-[#6F6262] transition-colors">${L(i)}</span><div class="text-base font-semibold text-[#1F1717]">${esc(c.t)}</div></button>`).join('');
  const numIn = `<input class="pq-in" id="nv" inputmode="decimal" autocomplete="off" placeholder="Your answer (number)" value="${esc(S.num.v)}" oninput="S.num.v=this.value;setLock()">${S.info.s.units ? `<input class="pq-in" autocomplete="off" placeholder="Unit (e.g. N)" value="${esc(S.num.u)}" oninput="S.num.u=this.value">` : ''}`;
  app.innerHTML = `<div class="nosel w-full"><div class="${CARD}">
<div class="flex items-center justify-between mb-4"><span class="text-xs font-semibold uppercase tracking-wider text-[#6F6262] bg-[#FBF7F6] px-2.5 py-1 rounded border border-[#E6D9D7]">${v.f ? 'Follow-up' : num ? 'Numeric answer' : 'Single choice'}</span><span class="text-xs text-[#6F6262]">${v.t}s</span></div>
${v.f ? `<div class="bg-[#FBF7F6] border border-[#E6D9D7] rounded-lg p-3 mb-4 text-sm text-[#6F6262]">Your problem was:<br><span class="text-[#1F1717]">${esc(v.ctx)}</span></div>` : ''}
<h2 class="text-xl font-semibold leading-relaxed mb-8" style="white-space:pre-wrap">${esc(v.q)}</h2>
${num ? `<div class="mb-8">${numIn}</div>` : `<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">${tiles}</div>`}
<div class="flex items-center justify-between pt-6 border-t border-[#E6D9D7] gap-3"><span class="text-xs text-[#6F6262]">Irreversible: you cannot return once you continue</span>
<button class="px-6 py-2.5 rounded-lg font-semibold text-sm transition-all ${BTN_OFF}" id="lockbtn" onclick="lock()" type="button" disabled>Lock in answer</button></div></div>
<div class="max-w-[900px] w-full mx-auto mt-4 flex items-center justify-between text-xs text-[#6F6262]">${S.info.s.calc ? '<button class="px-3 py-1.5 rounded-md hover:bg-white border border-transparent hover:border-[#E6D9D7]" onclick="tools()" type="button">Calculator &amp; formulas</button>' : '<span></span>'}<button class="px-3 py-1.5 rounded-md hover:bg-white border border-transparent hover:border-[#E6D9D7]" onclick="flagQ(this)" type="button">Report unclear question</button></div></div>`;
  setLock(); tick();
}
function pick(i) {
  S.sel = i;
  document.querySelectorAll('.answer-tile').forEach(t => t.classList.toggle('selected', +t.dataset.i === i));
  setLock();
}
function setLock() {
  const b = $('lockbtn'); if (!b || !S.v) return;
  const ok = S.v.type === 'num' ? String(S.num.v).trim() !== '' : S.sel !== null;
  b.disabled = !ok; b.className = 'px-6 py-2.5 rounded-lg font-semibold text-sm transition-all ' + (ok ? BTN_ON : BTN_OFF);
}

/* calculator + formula sheet (in-page overlay, never counts as leaving) */
const CONST = [['g', '9.8 m/s²'], ['G', '6.674×10⁻¹¹ N·m²/kg²'], ['c', '3.00×10⁸ m/s'], ['k (Coulomb)', '8.99×10⁹ N·m²/C²'], ['ε₀', '8.85×10⁻¹² F/m'], ['h', '6.626×10⁻³⁴ J·s'], ['e', '1.602×10⁻¹⁹ C'], ['mₑ', '9.11×10⁻³¹ kg'], ['mₚ', '1.673×10⁻²⁷ kg'], ['k_B', '1.381×10⁻²³ J/K'], ['N_A', '6.022×10²³ /mol'], ['R', '8.314 J/(mol·K)']];
const FORM = ['v = v₀ + at', 'x = x₀ + v₀t + ½at²', 'v² = v₀² + 2aΔx', 'F = ma', 'W = Fd cosθ', 'KE = ½mv²', 'PE = mgh', 'p = mv', 'τ = rF sinθ', 'F = Gm₁m₂/r²', 'F = kq₁q₂/r²', 'V = IR', 'P = IV'];
function tools() {
  if ($('tools')) return;
  const d = document.createElement('div'); d.id = 'tools'; d.style.cssText = 'position:fixed;inset:0;background:#FBF7F6;z-index:50;overflow:auto;padding:16px';
  d.innerHTML = `<div style="max-width:760px;margin:0 auto"><div class="flex items-center justify-between mb-3"><b>Calculator &amp; formulas</b><button class="px-4 py-2 rounded-lg ${BTN_ON} text-sm font-semibold" onclick="$('tools').remove()" type="button">Close</button></div>
<div class="bg-white border border-[#E6D9D7] rounded-xl p-4 mb-3"><input class="pq-in" id="cx" placeholder="Type or tap, e.g. 9.8*sin(30)" autocomplete="off" onkeydown="if(event.key==='Enter')cc()"><div id="cr" style="font-size:20px;min-height:30px;margin:8px 0"></div>
<div style="display:flex;flex-wrap:wrap;gap:6px">${['7', '8', '9', '/', 'sin(', 'cos(', '4', '5', '6', '*', 'tan(', '√(', '1', '2', '3', '-', 'log(', 'ln(', '0', '.', '^', '+', 'π', 'e', '(', ')', 'E'].map(k => `<button class="px-3 py-2 rounded-lg border border-[#E6D9D7] bg-white text-sm" onclick="ci('${k}')" type="button">${k}</button>`).join('')}<button class="px-3 py-2 rounded-lg ${BTN_ON} text-sm" onclick="cc()" type="button">=</button><button class="px-3 py-2 rounded-lg border border-[#E6D9D7] bg-white text-sm" onclick="$('cx').value='';$('cr').textContent=''" type="button">C</button></div>
<p class="text-xs text-[#6F6262] mt-2">Angles are in degrees. Use E for ×10ⁿ, e.g. 3E8.</p></div>
<div class="bg-white border border-[#E6D9D7] rounded-xl p-4 text-sm"><b>Constants</b>${CONST.map(c => `<div class="text-[#6F6262]">${c[0]} = ${c[1]}</div>`).join('')}<b style="display:block;margin-top:8px">Formulas</b>${FORM.map(f => `<div class="text-[#6F6262]">${f}</div>`).join('')}${S.info.s.sheet ? '<b style="display:block;margin-top:8px">From your professor</b><div class="text-[#6F6262]" style="white-space:pre-wrap">' + esc(S.info.s.sheet) + '</div>' : ''}</div></div>`;
  document.body.appendChild(d);
}
const ci = k => { $('cx').value += k === 'e' ? '2.718281828' : k; };
function cc() {
  try {
    // log( must be rewritten before ln( : ln( becomes Math.log( which would otherwise match log( again
    let s = $('cx').value.replace(/π/g, 'Math.PI').replace(/√\(/g, 'Math.sqrt(').replace(/\^/g, '**').replace(/\blog\(/g, 'Math.log10(').replace(/\bln\(/g, 'Math.log(').replace(/(\d)E(-?\d)/g, '$1e$2').replace(/\b(a?(?:sin|cos|tan))\(/g, '$1d(');
    const t = s.replace(/Math\.(PI|sqrt|log10|log)|a?(sin|cos|tan)d/g, ''); if (/[^0-9+\-*/().e\s]/.test(t)) throw 0;
    const Dg = Math.PI / 180, f = Function('sind', 'cosd', 'tand', 'asind', 'acosd', 'atand', 'return(' + s + ')')(x => Math.sin(x * Dg), x => Math.cos(x * Dg), x => Math.tan(x * Dg), x => Math.asin(x) / Dg, x => Math.acos(x) / Dg, x => Math.atan(x) / Dg);
    $('cr').textContent = isFinite(f) ? '= ' + (+f.toPrecision(10)) : 'Error';
  } catch (e) { $('cr').textContent = 'Error'; }
}
function flagQ(b) { ev('flag'); b.textContent = 'Reported'; b.disabled = true; }

async function spoll() {
  if (!S.v || S.v.status !== 'in_progress' || busy) return;
  try {
    const j = await api('state', { sid: S.sid, token: S.token });
    if (j.view.status !== 'in_progress' || j.view.cur !== S.v.cur || j.view.f !== S.v.f) setView(j.view);
    else { S.ann = j.view.ann || null; banners(); }
  } catch (e) { /* offline blip, try again later */ }
}
function tick() {
  const v = S.v; if (!v || v.status !== 'in_progress') return;
  const left = v.left - (performance.now() - S.t0), tl = $('countdown-display'), tb = $('timer-bar');
  if (left <= 0) { if (Date.now() >= retryAt) lock(); return; }
  if (tl) { tl.textContent = Math.ceil(left / 1000) + 's'; tl.style.color = left < 6000 ? '#B45309' : ''; tb.style.width = Math.max(0, left / (v.t * 10)) + '%'; tb.style.background = left < 6000 ? '#B45309' : ''; }
}
async function lock() {
  if (busy) return; busy = true;
  try { const j = await api('answer', { sid: S.sid, token: S.token, qi: S.v.qi, f: S.v.f ? 1 : 0, sel: S.sel === null ? -1 : S.sel, v: S.num.v, u: S.num.u }); retryAt = 0; setView(j.view); }
  catch (e) { retryAt = Date.now() + 2000; }       // retried by the timer
  busy = false;
}

/* ---- handwritten work photo ---- */
function workUI(w) {
  return `<div class="bg-[#FBF7F6] border border-[#E6D9D7] rounded-lg p-5 mb-6 text-left"><b>Show your work</b><p class="text-sm text-[#6F6262] mt-1">Your professor asked for a clear photo of your handwritten solution for ${w.items.length > 1 ? 'these problems' : 'this problem'}. ${w.open ? 'Upload by <b>' + esc(new Date(w.by).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })) + '</b>.' : '<span style="color:#B45309">The upload window has closed.</span>'}</p>`
    + w.items.map(x => `<div class="bg-white border border-[#E6D9D7] rounded-lg p-3 mt-3"><div class="text-xs text-[#6F6262]">Your problem ${x.n}</div><div class="text-sm">${esc(x.q)}</div>${x.up ? '<p class="text-sm" style="color:#1A7F4B">✔ Uploaded</p>' : ''}${w.open ? `<input type="file" accept="image/*" data-qi="${x.qi}" onchange="upl(this)" class="text-sm mt-2"><div class="text-xs text-[#6F6262]" id="up${x.qi}"></div>` : ''}</div>`).join('') + '</div>';
}
async function upl(inp) {
  const qi = +inp.dataset.qi, f = inp.files[0], m = $('up' + qi); if (!f) return;
  m.textContent = 'Uploading…';
  try { const img = await shrink(f); const j = await api('upload', { sid: S.sid, token: S.token, qi, img }); setView(j.view); }
  catch (e) { m.textContent = e.message || 'Upload failed. Try again.'; }
}
function shrink(file) {
  return new Promise((res, rej) => {
    const im = new Image(), u = URL.createObjectURL(file);
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Could not read that photo. Try a JPEG or PNG.')); };
    im.onload = () => {
      URL.revokeObjectURL(u);
      for (const [d, q] of [[1400, .72], [1100, .6], [900, .5], [700, .4]]) {
        const k = Math.min(1, d / Math.max(im.width, im.height)), c = document.createElement('canvas');
